[package]
name = "bulkhead-program-tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "LiteSVM tests: the real agave loader and runtime running Floor and Vault."

# Separate workspace: LiteSVM pins Solana crate versions that must not
# constrain the on-chain programs' own dependency graph.
[workspace]

[dependencies]
bulkhead-core = { path = "../../crates/bulkhead-core" }
litesvm = "=0.16.0"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-transaction = "4.1"
solana-message = "4.2"
solana-instruction = "~3.4"
solana-address = { version = "~2.6.1", features = ["curve25519", "decode", "sha2"] }
solana-account = "4.3"
solana-clock = "~3.1.1"
solana-loader-v3-interface = { version = "8.0.1", features = ["wincode"] }
solana-system-interface = { version = "3.2", features = ["bincode"] }
solana-sdk-ids = "3.1"
solana-rent = "~4.3.0"
solana-instruction-error = "~2.4.0"
solana-transaction-error = "~3.3.1"
