# cargo-deny policy for the LiteSVM test harness (programs/tests). It never
# ships: it runs the built programs in agave's runtime on the host. Same rules
# as ../../deny.toml, except five "unmaintained" notices in agave's own
# dependency tree, each listed. A vulnerability is never ignored here.

[advisories]
unmaintained = "all"
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2021-0139", reason = "ansi_term: unmaintained, via agave's logging; test-only" },
  { id = "RUSTSEC-2024-0388", reason = "derivative: unmaintained, via agave crates; test-only" },
  { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, via agave crates; test-only" },
  { id = "RUSTSEC-2025-0141", reason = "bincode 1: unmaintained, agave's account serialization; test-only" },
  { id = "RUSTSEC-2025-0161", reason = "libsecp256k1: unmaintained, agave's secp256k1 precompile; test-only" },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "NCSA",
]
confidence-threshold = 0.9
# One policy for several lockfiles: a licence one of them lacks is fine.
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
