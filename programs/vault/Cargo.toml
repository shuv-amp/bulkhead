[package]
name = "bulkhead-vault"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Bulkhead Vault: custody with backed/unbacked lanes, dual-GCRA limits and slow loosening."
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
bulkhead-core = { path = "../../crates/bulkhead-core" }
pinocchio = { version = "=0.11.2", default-features = false, features = ["cpi", "copy", "sha2"] }

# Off-chain builds (tests, clippy) derive PDAs without the on-chain syscall.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { version = "2", features = ["curve25519"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
