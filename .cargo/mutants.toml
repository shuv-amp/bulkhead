# cargo-mutants: the equivalent mutants of bulkhead-core, each explained in
# docs/09-VERIFICATION.md §6 ("Equivalent mutants"). They behave identically
# on every reachable input, so no test can kill them; excluding them lets CI
# require that every other mutant on a changed line is caught.
# Each pattern ends with the number of mutants it excludes, and
# scripts/mutants.sh checks every count against `cargo mutants --list`: a
# pattern that matches more or fewer mutants than its count fails. An edit
# that keeps the number but changes the mutants (an excluded line itself
# edited) passes, so such an edit needs the mutant judged again by hand.
# Patterns match file, column, mutation and function, not the line, so an
# edit elsewhere in a file keeps them; the murmur3 tail is the exception.
exclude_re = [
  # classify.rs: new == old == 0 already returned true
  'classify\.rs:\d+:20: replace > with >= in cap_tighter_or_equal$',  # 1
  # ledger.rs: net == 0 returns earlier
  'ledger\.rs:\d+:12: replace > with >= in contribution$',  # 1
  # ledger.rs: stored positions are never 0
  'ledger\.rs:\d+:40: replace < with <= in Ledger::has_liability$',  # 1
  'ledger\.rs:\d+:77: replace < with <= in Ledger::backed_amount$',  # 1
  # ledger.rs: after == 0 with the mint absent means b == 0, never evaluated
  'ledger\.rs:\d+:22: replace < with <= in Ledger::backed_amount$',  # 1
  # ledger.rs: the overflow fallback is unreachable with 8 positions
  'ledger\.rs:\d+:73: replace > with (==|<|>=) in Ledger::backed_amount$',  # 3
  # limiter.rs: at equality both branches give the same value
  'limiter\.rs:\d+:23: replace > with >= in capacity_from_ref$',  # 1
  'limiter\.rs:\d+:24: replace < with <= in clamp_capacity$',  # 1
  'limiter\.rs:\d+:21: replace > with >= in clamp_capacity$',  # 1
  'limiter\.rs:\d+:10: replace > with >= in cost_ms$',  # 1
  # limiter.rs: clamping an equal value is a no-op
  'limiter\.rs:\d+:(27|26): replace > with >= in reset_backlog$',  # 2
  # limiter.rs: the saturation guard is unreachable (result <= C <= u64::MAX)
  'limiter\.rs:\d+:10: replace > with (==|>=) in available_now$',  # 2
  # value.rs: the v > i128::MAX guard is unreachable
  'value\.rs:\d+:10: replace > with (==|>=) in value_v$',  # 2
  # floor.rs: k starts at 0 and each tail byte has its own 8 bits (XOR == OR).
  # By line: `h ^= k` in the body and after the tail sits at the same column
  # and is not equivalent (tests catch it). scripts/mutants.sh fails if a move leaves
  # these lines with other than 3 such mutants, not if one swaps for another.
  'floor\.rs:(355|358|361):11: replace \^= with \|= in murmur3_32$',  # 3
  # governance.rs: count == threshold already fails the quorum check
  'governance\.rs:\d+:50: replace > with >= in can_eject$',  # 1
]
