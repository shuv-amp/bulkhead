name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchains (Rust pinned by rust-toolchain.toml; Python and Node from the image)
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          python3 --version && node --version
      - name: Build differential worker
        run: cargo build --release -p bulkhead-diff
      - name: All checks
        env:
          CASES: "100000"
          BULKHEAD_CASES: "20000"
        run: scripts/check.sh

  programs:
    # Floor, Vault and Harbor built for sBPF v3 and run in LiteSVM (the real
    # agave runtime and loader), then the validator end-to-end run with the
    # Cloud guardian. Unaudited programs; nothing here touches a public cluster.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchains
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          rustup toolchain install nightly-2026-08-21 --profile minimal
      - name: Agave CLI v4.3.0 (cargo-build-sbf, solana-test-validator)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build, LiteSVM tests, end to end
        env:
          E2E: "1"
        run: scripts/check-programs.sh

  fuzz:
    # Coverage-guided fuzzing of the byte parsers and the full-width limiter
    # and ledger (fuzz/): 60 s per target, every target in parallel.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly-2026-08-21 --profile minimal
          cargo install --locked cargo-fuzz@0.13.2
      - name: Fuzz
        run: scripts/fuzz.sh
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  kani:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Kani bounded proofs (bulkhead-core)
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          working-directory: .
          args: -p bulkhead-core
