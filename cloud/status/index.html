<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulkhead Status</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #14161a; --muted: #5b6270; --line: #e3e6eb;
    --ok: #127a3e; --warn: #9a5b00; --bad: #b3261e; --accent: #2447d6;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --card: #171a21; --ink: #e8eaee; --muted: #9aa3b2; --line: #262b35;
      --ok: #4cc17a; --warn: #e0a33a; --bad: #ef6b62; --accent: #7d97ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --card: #171a21; --ink: #e8eaee; --muted: #9aa3b2; --line: #262b35;
    --ok: #4cc17a; --warn: #e0a33a; --bad: #ef6b62; --accent: #7d97ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .big { font-size: 28px; font-weight: 650; letter-spacing: -0.02em; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row span:first-child { color: var(--muted); }
  .row span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .pill.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); }
  .pill.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .headline { font-size: 17px; margin: 0 0 18px; padding: 14px 18px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
  .headline b { font-variant-numeric: tabular-nums; }
  form { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; margin-bottom: 18px; }
  form label { font-size: 12px; color: var(--muted); display: grid; gap: 3px; }
  input { font: 13px var(--mono); padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); min-width: 0; }
  button { grid-column: 1 / -1; justify-self: start; font: 600 14px system-ui; padding: 8px 14px; border-radius: 8px; border: 0; background: var(--accent); color: white; cursor: pointer; }
  .mono { font-family: var(--mono); font-size: 12px; word-break: break-all; }
  .err { color: var(--bad); white-space: pre-wrap; }
  footer { color: var(--muted); font-size: 12px; margin-top: 22px; }
  @media (max-width: 560px) { form { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Bulkhead status</h1>
  <p class="sub">The worst case, live, from the chain's own state: the same formulas as the Vault's <code>attest</code> instruction (checked equal to it in the end-to-end test).</p>
  <form id="f">
    <label>RPC <input name="rpc" placeholder="http://127.0.0.1:8899"></label>
    <label>Vault program <input name="vault" placeholder="Bulkhead Vault program id"></label>
    <label>Protocol program <input name="protocol" placeholder="the protocol's program id"></label>
    <label>Mints (comma separated) <input name="mints" placeholder="mint, mint"></label>
    <label>Floor program (optional) <input name="floor"></label>
    <label>Protected program (optional) <input name="protected"></label>
    <button>Load</button>
  </form>
  <div id="out"></div>
  <footer>Refreshes every 10 seconds. Guardians can stop, never steal; loosening waits at least 72 hours. <a href="https://github.com/shuv-amp/bulkhead">Source</a></footer>
</main>
<script type="module">
import { Rpc, decodeProtocol, decodeVault, decodeFloor } from "../lib/solana.mjs";
import { VaultClient, FloorClient } from "../lib/bulkhead.mjs";
import { readOpenChanges, openExit, duration, FLOOR_PROPOSAL_KINDS } from "../lib/changes.mjs";
import { attestLocal } from "../lib/limits.mjs";

const form = document.getElementById("f");
const out = document.getElementById("out");
const params = new URLSearchParams(location.search);
for (const [k, v] of params) if (form.elements[k]) form.elements[k].value = v;

const fmt = (raw, decimals) => {
  const n = Number(raw) / 10 ** decimals;
  return n.toLocaleString(undefined, { maximumFractionDigits: n < 100 ? 2 : 0 });
};
// `now` is the chain's clock, the one the row's colour is judged by.
const until = (s, now) => {
  const d = Math.round(s - now);
  return d <= 0 ? "no" : d < 5400 ? `yes, ${Math.round(d / 60)} more minutes` : `yes, ${Math.round(d / 3600)} more hours`;
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// Every loosening has a countdown, and says who can stop it (docs/02 §4).
async function changesRows(rpc, vc, protocol, now, live) {
  let open;
  try {
    open = await readOpenChanges(rpc, vc, protocol, now);
  } catch (e) {
    return `<div class="row"><span>Pending loosenings</span><span class="warn">unknown: ${esc(e.message)}</span></div>`;
  }
  if (!open.length) return `<div class="row"><span>Pending loosenings</span><span class="ok">none</span></div>`;
  const veto = live === 0 ? "no guardian is live to veto it" : live === 1 ? "the one live guardian can veto" : `any one of ${live} live guardians can veto`;
  return open.map((c) => {
    // The all-zero key: a kind whose value is in the payload (guardians, delay).
    const to = c.target === "11111111111111111111111111111111" ? "" : ` → <span class="mono">${esc(c.target.slice(0, 6))}…</span>`;
    const what = `#${c.id} ${esc(c.kindName)}${to}`;
    const when = c.state === "stale"
      ? `<span class="ok">stale: something changed after it was proposed, so it can never execute</span>`
      : c.state === "waiting"
        ? `<span class="warn">executable in ${duration(c.secondsLeft)}</span> (${new Date(c.executableS * 1000).toLocaleString()}); ${veto}`
        : `<span class="bad">executable now by anyone</span>, for ${duration(c.secondsLeft)} more; ${veto}`;
    return `<div class="row"><span>Pending loosening ${what}</span><span>${when}</span></div>`;
  }).join("");
}

function exitRow(exit, decimals) {
  if (!exit) return "";
  const when = exit.state === "waiting"
    ? `<span class="warn">executable in ${duration(exit.secondsLeft)}</span>`
    : `<span class="bad">executable now</span>, for ${duration(exit.secondsLeft)} more`;
  return `<div class="row"><span>Lifeboat exit of ${fmt(exit.amount, decimals)}</span><span>${when}; any live guardian can veto</span></div>`;
}

// The seal turns releases on: a loosening, so it gets a countdown too.
function sealRow(p, now, live) {
  if (p.sealed || !p.sealExecutableS) return "";
  if (p.sealVetoed) return `<div class="row"><span>Seal proposal</span><span class="ok">vetoed</span></div>`;
  if (now >= p.sealExpiresS) return `<div class="row"><span>Seal proposal</span><span class="ok">expired</span></div>`;
  const left = p.sealExecutableS - now;
  const veto = live === 0 ? "no guardian is live to veto it" : "any live guardian can veto";
  return `<div class="row"><span>Seal proposal (turns releases on)</span><span>${left > 0 ? `<span class="warn">executable in ${duration(left)}</span>` : `<span class="bad">executable now by anyone</span>`}; ${veto}</span></div>`;
}

function floorPending(fl, now) {
  if (!fl.pendingKind) return "none";
  const name = esc(FLOOR_PROPOSAL_KINDS[fl.pendingKind] ?? `kind ${fl.pendingKind}`);
  if (fl.pendingVetoed) return `${name}, vetoed`;
  if (now >= fl.pendingExpires) return `${name}, expired (can never execute)`;
  const left = fl.pendingEta - now;
  return left > 0
    ? `${name}, <span class="warn">executable in ${duration(left)}</span> (${new Date(fl.pendingEta * 1000).toLocaleString()}); any live guardian can veto`
    : `${name}, <span class="bad">executable now</span>; any live guardian can veto`;
}

// Program ids published in SECURITY.md. A link may name any program: a copy
// of the Vault deployed by anyone has the same layout and can report itself
// sealed, guarded and safe (docs/09, finding 85).
const KNOWN_VAULTS = { HK5FbaLtvNSPHj9HYbuStfVxXktkoMejJ9GEjn8WCY1b: "the devnet deployment" };
const KNOWN_FLOORS = { HARLZqMwqocBnbhbSTWkd5i8EHmjHXLHr1T9su3SR31E: "the devnet deployment" };

async function render() {
  const f = Object.fromEntries(new FormData(form));
  if (!f.rpc || !f.vault || !f.protocol || !f.mints) return;
  const rpc = new Rpc(f.rpc);
  const vc = await new VaultClient(f.vault, f.protocol).init();
  const protocol = decodeProtocol((await rpc.account(vc.protocol)).bytes);
  const slot = await rpc.call("getSlot", [{ commitment: "confirmed" }]);
  const now = await rpc.call("getBlockTime", [slot]);
  const live = protocol.guardians.filter((_, i) => now - protocol.lastHeartbeat[i] <= protocol.heartbeatIntervalS).length;
  let html = "";
  let headline = [];
  const mints = f.mints.split(",").map((m) => m.trim()).filter(Boolean);
  const warnings = [];
  if (!KNOWN_VAULTS[f.vault]) warnings.push(`The Vault program ${esc(f.vault)} is not a published Bulkhead deployment (SECURITY.md). Anyone can deploy a copy that reports itself safe: trust nothing below until you have checked this id.`);
  if (f.floor && !KNOWN_FLOORS[f.floor]) warnings.push(`The Floor program ${esc(f.floor)} is not a published Bulkhead deployment (SECURITY.md).`);
  // The headline sums only the vaults named in the link: one left out is
  // money the page does not count (finding 85).
  if (mints.length < protocol.vaultCount) warnings.push(`This protocol has ${esc(protocol.vaultCount)} vaults; the link names ${mints.length}, so the worst case below leaves some out. Add every mint.`);
  for (const mint of mints) {
    const { vault, vaultTokens } = await vc.vault(mint);
    const v = decodeVault((await rpc.account(vault)).bytes);
    const tokens = await rpc.account(vaultTokens);
    const balance = new DataView(tokens.bytes.buffer, tokens.bytes.byteOffset).getBigUint64(64, true);
    const a = attestLocal(v, protocol, balance, now);
    const d = v.decimals;
    headline.push(`${fmt(a.availableNow, d)} now, at most ${fmt(a.worst1h, d)} in an hour and ${fmt(a.worst24h, d)} in a day`);
    const frozen = a.frozenUntil > now;
    html += `<div class="card">
      <h2>Vault · <span class="mono">${esc(mint.slice(0, 6))}…</span></h2>
      <div class="big">${fmt(a.balance, d)}</div>
      <div class="row"><span>Instant unbacked outflow now</span><span>${fmt(a.availableNow, d)}</span></div>
      <div class="row"><span>Worst case, nobody acts for 1h</span><span>${fmt(a.worst1h, d)}</span></div>
      <div class="row"><span>Worst case, nobody acts for 24h</span><span>${fmt(a.worst24h, d)}</span></div>
      <div class="row"><span>Frozen</span><span class="${frozen ? "warn" : "ok"}">${until(a.frozenUntil, now)}</span></div>
      <div class="row"><span>Pending tickets</span><span>${a.pendingTickets} (${fmt(a.queued, d)})</span></div>
      <div class="row"><span>Limits</span><span>${v.limits.shortBps / 100}% / ${v.limits.shortWindowS / 3600}h · ${v.limits.longBps / 100}% / ${v.limits.longWindowS / 3600}h</span></div>
      <div class="row"><span>Absolute caps</span>${
        // Without caps, capital an attacker parks in the vault first widens
        // the base the percentages apply to (docs/15, A1b; docs/16 §4.5).
        v.limits.shortCap > 0n && v.limits.longCap > 0n
          ? `<span class="ok">${fmt(v.limits.shortCap, d)} / ${fmt(v.limits.longCap, d)}</span>`
          : `<span class="bad">UNCAPPED: parked capital widens the bound (A1b)</span>`
      }</div>
      <div class="row"><span>Paid out (backed / unbacked)</span><span>${fmt(v.backedOut, d)} / ${fmt(v.unbackedOut, d)}</span></div>
      ${exitRow(openExit(v, now), d)}
    </div>`;
  }
  html = `<div class="card">
      <h2>Protocol</h2>
      ${await changesRows(rpc, vc, protocol, now, live)}
      <div class="row"><span>Sealed</span><span class="${protocol.sealed ? "ok" : "warn"}">${protocol.sealed ? "yes" : "no (releases disabled)"}</span></div>
      ${sealRow(protocol, now, live)}
      <div class="row"><span>Frozen</span><span class="${protocol.frozenUntil > now ? "warn" : "ok"}">${until(protocol.frozenUntil, now)}</span></div>
      <div class="row"><span>Live guardians</span><span class="${live >= protocol.threshold ? "ok" : "bad"}">${live} of ${protocol.guardians.length} (quorum ${protocol.threshold})</span></div>
      <div class="row"><span>Any loosening waits</span><span>${Math.round(protocol.loosenDelayS / 3600)} hours (minimum 72, a constant)</span></div>
      <div class="row"><span>Admin</span><span class="mono">${esc(protocol.admin)}</span></div>
    </div>` + html;
  if (f.floor && f.protected) {
    const fc = await new FloorClient(f.floor, f.protected).init();
    const acc = await rpc.account(fc.config);
    if (acc) {
      const fl = decodeFloor(acc.bytes);
      // L2BEAT's Security Council bar: >= 8 members and a >= 75% threshold. Its third
      // rule (>= 50% of members outside the team) is not visible on-chain.
      const n = fl.guardians.length;
      const councilBar = n >= 8 && fl.threshold * 4 >= n * 3;
      html += `<div class="card">
        <h2>Floor · upgrade key</h2>
        <div class="big ${fl.status === "live" ? "ok" : "bad"}">${fl.status === "live" ? "Live" : "Stopped"}</div>
        <div class="row"><span>New code waits</span><span>${Math.round(fl.upgradeDelayS / 3600)} hours${fl.upgradeDelayS >= 604800 ? ' <span class="pill ok">Stage-1-grade exit window</span>' : ""}</span></div>
        <div class="row"><span>Stop button staged</span><span class="${fl.abortStaged ? "ok" : "bad"}">${fl.abortStaged ? "yes" : "no"}</span></div>
        <div class="row"><span>Snapshot for instant restore</span>${
          // While live, a pinned snapshot is checked against the code at the
          // stop; once stopped, only a snapshot found valid then restores.
          fl.status === "live"
            ? `<span class="${fl.snapshotPinned ? "ok" : "warn"}">${fl.snapshotPinned ? "pinned" : "not pinned"}</span>`
            : `<span class="${fl.snapshotValid ? "ok" : "bad"}">${fl.snapshotValid ? "valid: a quorum can restore at once" : "not usable: the restore must wait the delay"}</span>`
        }</div>
        <div class="row"><span>sBPF v3 (SIMD-0500 ready)</span><span class="${fl.elfIsV3 ? "ok" : "warn"}">${fl.elfIsV3 ? "yes" : "no: build and test a v3 binary"}</span></div>
        <div class="row"><span>Live guardians</span><span>${fl.guardians.filter((_, i) => now - fl.lastHeartbeat[i] <= fl.heartbeatIntervalS).length} of ${fl.guardians.length} (quorum ${fl.threshold})</span></div>
        <div class="row"><span>L2BEAT Security Council bar</span><span class="${councilBar ? "ok" : "warn"}">${councilBar ? "met" : "not met"}: ${n} guardians, quorum ${fl.threshold} (bar: ≥ 8, ≥ 75%; outside members not visible on-chain)</span></div>
        <div class="row"><span>Pending proposal</span><span>${floorPending(fl, now)}</span></div>
      </div>`;
    } else {
      // It used to vanish without a word.
      html += `<div class="card"><h2>Floor · upgrade key</h2><div class="big bad">Not under Floor</div><div class="row"><span>No Floor config for</span><span class="mono">${esc(f.protected)}</span></div></div>`;
    }
  }
  // Whose data this is and from when: a link can name any RPC, and a stale
  // page must not pass for a live one.
  const host = (() => { try { return new URL(f.rpc).host; } catch { return f.rpc; } })();
  const source = `<p class="mono">Read from ${esc(host)} at slot ${esc(slot)}, chain time ${new Date(now * 1000).toLocaleString()} (shown ${new Date().toLocaleTimeString()}). Vault program ${esc(f.vault)}${KNOWN_VAULTS[f.vault] ? ` (${KNOWN_VAULTS[f.vault]})` : ""}, protocol ${esc(f.protocol)}, mints ${esc(mints.join(", "))}. Trust it only as far as you trust that RPC and these ids.</p>`;
  const banner = warnings.map((w) => `<p class="headline bad">${w}</p>`).join("");
  return `${banner}<p class="headline">Worst case right now: <b>${esc(headline.join("; "))}</b>.</p>${source}<div class="grid">${html}</div>`;
}

// One refresh at a time on the timer, and only the newest result is shown: a
// slow render for the previous inputs must not overwrite the current ones.
let generation = 0;
let running = false;
async function refresh() {
  const mine = ++generation;
  running = true;
  let html;
  try {
    html = await render();
  } catch (e) {
    html = `<div class="card err">${esc(e.message)}</div>`;
  } finally {
    if (mine === generation) running = false;
  }
  if (mine === generation) out.innerHTML = html;
}
form.addEventListener("submit", (e) => {
  e.preventDefault();
  history.replaceState(null, "", "?" + new URLSearchParams(new FormData(form)));
  refresh();
});
refresh();
setInterval(() => { if (!running) refresh(); }, 10_000);
</script>
</body>
</html>
